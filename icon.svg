<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Achtergrond cirkel met gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f77b4"/>
      <stop offset="100%" stop-color="#0f4b78"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Ronde achtergrond -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Huis icoon -->
  <path d="M 256 100 L 400 220 L 400 400 L 112 400 L 112 220 Z" 
        fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Dak lijnen -->
  <path d="M 256 100 L 400 220" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 100 L 112 220" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Deur -->
  <rect x="220" y="300" width="72" height="100" fill="#ffffff" opacity="0.3" rx="4"/>
  <circle cx="278" cy="355" r="4" fill="#0f4b78"/>
  
  <!-- Raam -->
  <rect x="150" y="260" width="50" height="50" fill="#ffffff" opacity="0.3" rx="4"/>
  <rect x="312" y="260" width="50" height="50" fill="#ffffff" opacity="0.3" rx="4"/>
  
  <!-- Warmtepomp / vlam icoon bovenop -->
  <g transform="translate(256, 200)">
    <!-- Vlam vorm -->
    <path d="M 0 -80 C -30 -40, -40 -20, -40 10 C -40 40, -20 60, 0 60 C 20 60, 40 40, 40 10 C 40 -20, 30 -40, 0 -80 Z" 
          fill="url(#flameGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- Binnenste vlam -->
    <path d="M 0 -40 C -15 -15, -20 0, -20 15 C -20 30, -10 40, 0 40 C 10 40, 20 30, 20 15 C 20 0, 15 -15, 0 -40 Z" 
          fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Warmtestralen -->
  <path d="M 130 150 Q 120 130 130 110" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 382 150 Q 392 130 382 110" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 100 200 Q 90 180 100 160" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 412 200 Q 422 180 412 160" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>